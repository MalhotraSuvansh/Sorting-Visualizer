<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorting Visualizer</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  
  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Sorting Visualizer</h1>
    <p>Watch algorithms in action</p>
  </header>

  <div class="card">
    <div class="controls">
      <select id="algo">
        <option value="bubble">Bubble sort</option>
        <option value="selection">Selection sort</option>
        <option value="insertion">Insertion sort</option>
        <option value="merge">Merge sort</option>
        <option value="quick">Quick sort</option>
      </select>

      <div class="slider-group">
        <label for="sizeSlider">Size</label>
        <input type="range" id="sizeSlider" min="10" max="80" value="40" step="1" />
        <span class="slider-val" id="sizeOut">40</span>
      </div>

      <div class="slider-group">
        <label for="speedSlider">Speed</label>
        <input type="range" id="speedSlider" min="1" max="35" value="10" step="1" />
      </div>

      <button class="secondary" id="shuffleBtn">&#8635; Shuffle</button>
      <button class="primary" id="sortBtn">&#9654; Sort</button>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Comparisons</span>
        <span class="stat-value" id="compCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Swaps</span>
        <span class="stat-value" id="swapCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Status</span>
        <span class="stat-value" id="statusText">Ready</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <div id="canvas"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#4d7fff"></div>Unsorted</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff4d6a"></div>Comparing</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ffb84d"></div>Swapping</div>
        <div class="legend-item"><div class="legend-dot" style="background:#4dffaa"></div>Sorted</div>
        <div class="legend-item"><div class="legend-dot" style="background:#b84dff"></div>Pivot</div>
      </div>
    </div>

    <div class="algo-info" id="algoInfo"></div>
  </div>

  <!-- Scripts -->
  <script src="script.js" defer></script>
</body>
</html>
